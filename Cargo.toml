[package]
name = "drabi"
version = "0.1.4"
edition = "2024"
default-run = "drabi"
rust-version = "1.89"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
encoding_rs = "0.8"
comfy-table = { version = "7.2.2", default-features = false }
directories = "6"
flate2 = "1"
icoextract_rs = "0.1.2"
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg", "webp"] }
xz2 = "0.1"
libc = "0.2"
lnk = "0.6.4"
pelite = "0.10"
walkdir = "2"
winsplit = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.9"
shell-words = "1"

[features]
station = ["dep:bevy"]

[dependencies.bevy]
version = "0.17.3"
optional = true
default-features = false
features = ["std", "async_executor", "multi_threaded", "bevy_winit", "bevy_gilrs", "bevy_ui_render", "bevy_log", "default_font", "x11", "wayland", "png", "jpeg"]

[[bin]]
name = "drabi-station"
path = "src/station_frontend.rs"
required-features = ["station"]

[package]
name = "drabi"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
flate2 = "1"
icoextract_rs = "0.1.2"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
xz2 = "0.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.9"
shell-words = "1"
